name: Promote artifact through environments

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            sha:
                description: Commit SHA to promote from main
                required: false
                type: string

permissions:
    contents: write
    deployments: write

jobs:
    build:
        name: Build and validate
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.meta.outputs.sha }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.sha || github.sha }}

            - name: Run unit tests
              run: python -m unittest discover -s tests -v

            - name: Record artifact metadata
              id: meta
              run: |
                  echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  python - <<'PY'
                  import json
                  import os

                  metadata = {
                      "commit": os.environ["GITHUB_SHA"],
                      "environments": ["dev", "qa", "stg", "prd"],
                      "branch": "main",
                  }

                  with open("artifact-metadata.json", "w", encoding="utf-8") as fh:
                      json.dump(metadata, fh, indent=2)
                  PY

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: promotion-build-${{ github.run_number }}
                  path: artifact-metadata.json

    promote-dev:
        name: Deploy to dev
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: dev
            url: https://example.com/dev
        steps:
            - name: Checkout main
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.sha }}
                  fetch-depth: 0

            - name: Update dev environment branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B dev HEAD
                  git push origin dev --force-with-lease

    promote-qa:
        name: Deploy to qa
        needs: promote-dev
        runs-on: ubuntu-latest
        environment:
            name: qa
            url: https://example.com/qa
        steps:
            - name: Checkout promoted build
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.sha }}
                  fetch-depth: 0

            - name: Update qa environment branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B qa HEAD
                  git push origin qa --force-with-lease

    promote-stg:
        name: Deploy to stg
        needs: promote-qa
        runs-on: ubuntu-latest
        environment:
            name: stg
            url: https://example.com/stg
        steps:
            - name: Checkout promoted build
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.sha }}
                  fetch-depth: 0

            - name: Update stg environment branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B stg HEAD
                  git push origin stg --force-with-lease

    promote-prd:
        name: Deploy to prd
        needs: promote-stg
        runs-on: ubuntu-latest
        environment:
            name: prd
            url: https://example.com/prd
        steps:
            - name: Checkout promoted build
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.sha }}
                  fetch-depth: 0

            - name: Update prd environment branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B prd HEAD
                  git push origin prd --force-with-lease
