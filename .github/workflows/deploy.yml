name: Multi-Stage Deployment Pipeline

on:
    push:
        branches:
            - dev
            - qa
            - stage
            - prod

jobs:
    build:
        name: Validate and package build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run unit tests
              run: python -m unittest discover -s tests -v

            - name: Build application
              run: |
                  mkdir -p build-output
                  echo "Compiling code for ${{ github.ref_name }}..." > build-output/app.txt

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-artifact-${{ github.ref_name }}
                  path: build-output/

    deploy-dev:
        name: Deploy to Dev
        needs: build
        if: github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: app-artifact-dev

            - name: Deploy to Dev environment
              run: |
                  echo "Deploying merged dev branch to Dev"
                  echo "Using Dev URL: ${{ vars.API_URL }}"
                  echo "Using Dev Token: ${{ secrets.DEPLOY_TOKEN }}"

    deploy-qa:
        name: Deploy to QA
        needs: build
        if: github.ref == 'refs/heads/qa'
        runs-on: ubuntu-latest
        environment: qa
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: app-artifact-qa

            - name: Deploy to QA environment
              run: |
                  echo "Deploying merged qa branch to QA"
                  echo "Using QA URL: ${{ vars.API_URL }}"
                  echo "Using QA Token: ${{ secrets.DEPLOY_TOKEN }}"

    deploy-stage:
        name: Deploy to Stage
        needs: build
        if: github.ref == 'refs/heads/stage'
        runs-on: ubuntu-latest
        environment: stage
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: app-artifact-stage

            - name: Deploy to Stage environment
              run: |
                  echo "Deploying merged stage branch to Stage"
                  echo "Using Stage URL: ${{ vars.API_URL }}"
                  echo "Using Stage Token: ${{ secrets.DEPLOY_TOKEN }}"

    deploy-prod:
        name: Deploy to Prod
        needs: build
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: app-artifact-prod

            - name: Deploy to Prod environment
              run: |
                  echo "Deploying merged prod branch to Prod"
                  echo "Using Prod URL: ${{ vars.API_URL }}"
                  echo "Using Prod Token: ${{ secrets.DEPLOY_TOKEN }}"
