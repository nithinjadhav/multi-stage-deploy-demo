name: Deploy (dev → qa → stg → prd)

# One PR per change merges to main; this pipeline promotes that single build through
# every environment in order. GitHub Environments dev/qa/stg/prd gate each stage:
# add "Required reviewers" to qa/stg/prd (repo Settings → Environments) to pause for
# approval before promoting. Each stage also advances its environment branch to the
# deployed commit, so dev/qa/stg/prd branches track what is live in each environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to advance the environment branches

jobs:
  build:
    runs-on: ubuntu-latest
    #  steps:
      #  - uses: actions/checkout@v4
      #  - name: Set up .NET
      #  uses: actions/setup-dotnet@v4
      #   with:
      #      dotnet-version: '10.0.x'
      #  - name: Test
      #   run: dotnet test backend/NjAutomation.sln -c Release
      #  - name: Publish API
      # run: dotnet publish backend/src/NjAutomation.Api/NjAutomation.Api.csproj -c Release -o publish
      # - name: Upload artifact
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: api
      #    path: publish

  dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api, path: publish }
      - name: Deploy to dev
        run: echo "TODO deploy toDEV App Service. See docs/ci-cd.md for the azure/webapps-deploy wiring."
        # - uses: azure/webapps-deploy@v3
        #   with:
        #     app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        #     package: publish
      - name: Advance dev branch
        run: git push origin ${{ github.sha }}:refs/heads/dev

  qa:
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api, path: publish }
      - name: Deploy to qa
        run: echo "TODO deploy toQA App Service."
      - name: Advance qa branch
        run: git push origin ${{ github.sha }}:refs/heads/qa

  stg:
    needs: qa
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api, path: publish }
      - name: Deploy to stg
        run: echo "TODO deploy toSTG App Service."
      - name: Advance stg branch
        run: git push origin ${{ github.sha }}:refs/heads/stg

  prd:
    needs: stg
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api, path: publish }
      - name: Deploy to prd
        run: echo "TODO deploy toPRD App Service."
      - name: Advance prd branch
        run: git push origin ${{ github.sha }}:refs/heads/prd
