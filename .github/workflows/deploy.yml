name: Multi-Stage Branch Deployment Pipeline

on:
    push:
        branches:
            - main
            - dev
            - qa
            - stage
            - prod

env:
    ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
    promote-dev:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Checkout repo
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Merge main into dev
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin
                  git checkout dev
                  git merge --no-edit origin/main
                  git push origin dev

    deploy-dev:
        if: github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Checkout dev branch
              uses: actions/checkout@v5
              with:
                  ref: dev
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Run tests
              run: python -m unittest discover -s tests -v

            - name: Deploy to Dev
              run: |
                  echo "Deploying merged changes to Dev branch"
                  echo "Using Dev URL: ${{ vars.API_URL }}"
                  echo "Using Dev Token: ${{ secrets.DEPLOY_TOKEN }}"

    promote-qa:
        if: github.ref == 'refs/heads/dev'
        needs: deploy-dev
        runs-on: ubuntu-latest
        environment: qa
        steps:
            - name: Checkout repo
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Merge dev into qa
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin
                  git checkout qa
                  git merge --no-edit origin/dev
                  git push origin qa

    deploy-qa:
        if: github.ref == 'refs/heads/qa'
        runs-on: ubuntu-latest
        environment: qa
        steps:
            - name: Checkout qa branch
              uses: actions/checkout@v5
              with:
                  ref: qa
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Run tests
              run: python -m unittest discover -s tests -v

            - name: Deploy to QA
              run: |
                  echo "Deploying merged changes to QA branch"
                  echo "Using QA URL: ${{ vars.API_URL }}"
                  echo "Using QA Token: ${{ secrets.DEPLOY_TOKEN }}"

    promote-stage:
        if: github.ref == 'refs/heads/qa'
        needs: deploy-qa
        runs-on: ubuntu-latest
        environment: stage
        steps:
            - name: Checkout repo
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Merge qa into stage
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin
                  git checkout stage
                  git merge --no-edit origin/qa
                  git push origin stage

    deploy-stage:
        if: github.ref == 'refs/heads/stage'
        runs-on: ubuntu-latest
        environment: stage
        steps:
            - name: Checkout stage branch
              uses: actions/checkout@v5
              with:
                  ref: stage
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Run tests
              run: python -m unittest discover -s tests -v

            - name: Deploy to Stage
              run: |
                  echo "Deploying merged changes to Stage branch"
                  echo "Using Stage URL: ${{ vars.API_URL }}"
                  echo "Using Stage Token: ${{ secrets.DEPLOY_TOKEN }}"

    promote-prod:
        if: github.ref == 'refs/heads/stage'
        needs: deploy-stage
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: Checkout repo
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Merge stage into prod
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin
                  git checkout prod
                  git merge --no-edit origin/stage
                  git push origin prod

    deploy-prod:
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: Checkout prod branch
              uses: actions/checkout@v5
              with:
                  ref: prod
                  token: ${{ secrets.TOKEN_PAT }}

            - name: Run tests
              run: python -m unittest discover -s tests -v

            - name: Deploy to Prod
              run: |
                  echo "Deploying merged changes to Prod branch"
                  echo "Using Prod URL: ${{ vars.API_URL }}"
                  echo "Using Prod Token: ${{ secrets.DEPLOY_TOKEN }}"
