name: Deploy (dev → qa → stg → prd)

# One PR per change merges to main; this pipeline promotes that single build through
# every environment in order. GitHub Environments dev/qa/stg/prd gate each stage:
# add "Required reviewers" to qa/stg/prd (repo Settings → Environments) to pause for
# approval before promoting. Each stage also advances its environment branch to the
# deployed commit, so dev/qa/stg/prd branches track what is live in each environment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # to advance the environment branches

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifact
        run: |
          # Replace these steps with your real build/publish commands.
          # The workflow previously had commented-out .NET steps; keep or replace as needed.
          mkdir -p publish
          echo "placeholder artifact" > publish/README.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: publish
      - name: Deploy to dev
        run: |
          echo "TODO: deploy to DEV App Service. See docs/ci-cd.md for the azure/webapps-deploy wiring."
      - name: Configure git for branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Advance dev branch
        run: git push origin --force-with-lease ${{ github.sha }}:refs/heads/dev

  qa:
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: publish
      - name: Deploy to qa
        run: |
          echo "TODO: deploy to QA App Service."
      - name: Configure git for branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Advance qa branch
        run: git push origin --force-with-lease ${{ github.sha }}:refs/heads/qa

  stg:
    needs: qa
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: publish
      - name: Deploy to stg
        run: |
          echo "TODO: deploy to STG App Service."
      - name: Configure git for branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Advance stg branch
        run: git push origin --force-with-lease ${{ github.sha }}:refs/heads/stg

  prd:
    needs: stg
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: publish
      - name: Deploy to prd
        run: |
          echo "TODO: deploy to PRD App Service."
      - name: Configure git for branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Advance prd branch
        run: git push origin --force-with-lease ${{ github.sha }}:refs/heads/prd
